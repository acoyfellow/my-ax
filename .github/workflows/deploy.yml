name: deploy

# Machine-free production deploy for My AX.
#
# This is the Class B path: it runs on a GitHub-hosted ubuntu runner, which
# HAS a Docker daemon, so `wrangler deploy` can build and push the Sandbox
# container image (wrangler.jsonc -> containers[].image = ./Dockerfile) to the
# Cloudflare Container Registry. Use this whenever the Dockerfile / container
# context changes (or for a normal full deploy). For code-only hotfixes that do
# NOT touch the Dockerfile, prefer scripts/deploy-remote.mjs (no Docker needed).
#
# Trigger: manual (workflow_dispatch, incl. from the agent via the GitHub API)
# or by pushing a v* tag.
#
# REQUIRED secrets/vars (Settings -> Secrets and variables -> Actions):
#   secrets.CLOUDFLARE_API_TOKEN   scoped: Workers Scripts:Edit,
#                                  Workers Builds / Cloudflare Images:Edit
#                                  (container registry push), D1:Edit, R2:Edit,
#                                  Account Settings:Read, Zone DNS:Edit
#                                  (Zone DNS is required for custom_domain:true
#                                  and is the usual silent failure).
#   secrets.CLOUDFLARE_ACCOUNT_ID  target account id.
#   secrets.CF_ACCESS_AUD          Access application AUD (deploy-time var).
#   secrets.CF_ACCESS_ISS          Access issuer(s) (deploy-time var).
#   vars.BRIDGE_BASE_URL           public origin of this deploy.
#
# NOTE: the PUBLIC repo ships empty `vars` and empty `routes` in wrangler.jsonc.
# Deploying it verbatim would blank your auth config and drop your custom
# domain. This workflow re-injects the deploy-time vars from secrets via
# `--var`. Host it in the repo that carries your REAL production wrangler config
# (routes / custom_domain), e.g. my-ax-private, or add the route back there.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this deploy (recorded in the run)"
        required: false
        default: "manual dispatch"
      run_migrations:
        description: "Apply pending D1 migrations before deploy"
        type: boolean
        required: false
        default: true
  push:
    tags:
      - "v*"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Same gates CI already enforces, before we touch production.
      - name: Verify public-clean
        run: npm run verify:public
      - name: Build assets + typecheck + unit tests
        run: npm run check
      - name: Verify no stale legacy surfaces
        run: npm run verify:legacy-surface

      - name: Apply D1 migrations
        if: ${{ github.event_name == 'push' || inputs.run_migrations }}
        run: npx wrangler d1 migrations apply my-ax-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # IMPORTANT: do NOT pass deploy-time vars with `wrangler deploy --var`.
      # On wrangler >= 4.100 a CLI --var REPLACES the entire config vars block,
      # silently wiping every var you didn't list (this repo already got bitten:
      # it wiped CF_ACCESS_ISS). Instead, commit your real CF_ACCESS_AUD/ISS,
      # BRIDGE_BASE_URL and routes in the wrangler.jsonc of the repo/fork this
      # workflow runs from (e.g. my-ax-private, or via employee-config.patch).
      # Public main intentionally ships these empty for OSS self-hosters.
      #
      # Docker is available on the runner, so the Sandbox image builds + pushes here.
      - name: Deploy (Worker + Sandbox container image)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Record deployed sandbox image digest
        if: ${{ always() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The fast-path (scripts/deploy-remote.mjs) pins to this digest so it
          # can deploy Worker-only changes without Docker. Persist it as a build
          # artifact for humans/agents to read back.
          npx wrangler containers list 2>/dev/null | tee sandbox-images.txt || true
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: sandbox-images
          path: sandbox-images.txt
          if-no-files-found: ignore
