name: voxl-probe
on:
  push:
    branches: [feat/voxl-computer]
    paths: [docker/voxl.Dockerfile, .github/workflows/voxl-probe.yml]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --platform linux/amd64 -f docker/voxl.Dockerfile -t voxl-probe . 2>&1 | tail -80
      - run: docker run --rm voxl-probe sh -c 'voxl --version && ldd /usr/local/bin/voxl | grep -i "not found" || echo libs-ok'
